{{define "content"}}
<h2>Вход</h2>
<form action="http://register-service:8081/login" method="post">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

<a href="/register" class="aa">Еще не зарегистрированы?</a>

{{end}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stat
spec:
  selector:
    matchLabels:
      app: stat
  template:
    metadata:
      labels:
        app: stat
    spec:
      containers:
      - name: stat
        image: gaarge/rd_stat:2.2
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stat
spec:
  type: NodePort
  selector:
    app: stat
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080

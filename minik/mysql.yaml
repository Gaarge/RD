apiVersion: apps/v1
kind: Deployment              
metadata:
  name: mysql                   
spec:
  selector:
    matchLabels:                
      app: mysql
  template:                     
    metadata:
      labels:                   
        app: mysql
    spec:
      containers:               
      - name: mysql             
        image: gaarge/rd_mysql:1.1
        ports:
        - containerPort: 3306
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306

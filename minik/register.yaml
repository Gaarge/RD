apiVersion: apps/v1
kind: Deployment
metadata:
  name: register
spec:
  selector:
    matchLabels:
      app: register
  template:
    metadata:
      labels:
        app: register
    spec:
      containers:
      - name: register
        image: gaarge/rd_register:1.5
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: register
spec:
  type: NodePort
  selector:
    app: register
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
